name: JRA 原本MASTER・全部まとめて差分更新
run-name: "JRA ${{ inputs.year }}｜${{ inputs.mode }}｜run ${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      year:
        description: 対象年（2026から開始）
        required: true
        default: '2026'
        type: string
      mode:
        description: 毎週はupdateだけ（結果＋オッズ＋血統＋馬場）
        type: choice
        options: [preflight, bootstrap, reaudit, update, pedigree, export, track, diagnose, cardprobe]
        default: update
      base_release_tag:
        type: string
        description: 元ZIPを置いたReleaseタグ（例 inputs-2026）
        default: ''
      base_asset_name:
        type: string
        description: Release内の元ZIPの正確なファイル名
        default: ''
      months:
        type: string
        description: 更新対象月（例 9,10）。空欄は日付範囲から決定
        default: ''
      start_date:
        type: string
        description: 更新開始日 YYYY-MM-DD（毎週は前回最終日から）
        default: ''
      end_date:
        type: string
        description: 更新終了日 YYYY-MM-DD。空欄は当日まで
        default: ''
      with_pedigree:
        description: 血統4項目も取得する（毎週はONのまま）
        type: boolean
        default: true
      with_track:
        description: 含水率・クッション値・使用コースも取得（毎週はONのまま）
        type: boolean
        default: true
      max_horses:
        type: string
        description: 今回の血統取得上限（取得済みの馬は省略）
        default: '12000'
      max_sources:
        type: string
        description: 本文の取得・再監査上限（取得済みは省略）
        default: '12000'
      refresh:
        description: 完了済み対象レースも再取得して公式訂正を確認
        type: boolean
        default: false
      resume_run_id:
        type: string
        description: 空欄は最新state。指定時はその実行のstateへ戻す
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: jra-original-master-${{ inputs.year }}
  cancel-in-progress: false
jobs:
  collect:
    name: "JRA ${{ inputs.year }}｜${{ inputs.mode }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_YEAR: ${{ inputs.year }}
      MODE: ${{ inputs.mode }}
      BASE_RELEASE_TAG: ${{ inputs.base_release_tag }}
      BASE_ASSET_NAME: ${{ inputs.base_asset_name }}
      MONTHS: ${{ inputs.months }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      WITH_PEDIGREE: ${{ inputs.with_pedigree }}
      WITH_TRACK: ${{ inputs.with_track }}
      MAX_HORSES: ${{ inputs.max_horses }}
      MAX_SOURCES: ${{ inputs.max_sources }}
      REFRESH: ${{ inputs.refresh }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取得エンジンを展開
        run: unzip -q ./jra_original_master_engine.zip -d engine
      - name: 依存ライブラリを準備
        run: python -m pip install ./engine
      - name: 馬場公式PDFの解析ライブラリ（updateでも自動使用）
        if: inputs.mode == 'track' || (inputs.mode == 'update' && inputs.with_track)
        run: python -m pip install "pdfplumber>=0.11,<1" "requests>=2.31,<3"
      - name: オフライン自己検査
        run: python -m unittest discover -s engine/tests -v
      - uses: actions/cache@v4
        if: inputs.mode == 'track' || (inputs.mode == 'update' && inputs.with_track)
        with:
          path: jra_pdf_cache
          key: jra-track-cache-${{ inputs.year }}-${{ github.run_id }}
          restore-keys: |
            jra-track-cache-${{ inputs.year }}-
      - name: 前回stateを自動復元
        if: inputs.mode != 'preflight' && inputs.mode != 'diagnose' && inputs.mode != 'cardprobe'
        run: python engine/scripts/restore_state.py --year "$TARGET_YEAR" --run-id "$RESUME_RUN_ID"
      - name: 取得・再監査・修正・統合
        run: python engine/scripts/action_run.py
      - name: 途中状態を保存（失敗時も）
        if: always() && inputs.mode != 'preflight' && inputs.mode != 'diagnose' && inputs.mode != 'cardprobe'
        uses: actions/upload-artifact@v4
        with:
          name: jra-original-state-${{ inputs.year }}
          path: state/${{ inputs.year }}/MASTER.sqlite3
          if-no-files-found: warn
          retention-days: 30
      - name: 馬場PDF解析監査を保存
        if: always() && (inputs.mode == 'track' || (inputs.mode == 'update' && inputs.with_track))
        uses: actions/upload-artifact@v4
        with:
          name: jra-track-audit-${{ inputs.year }}
          path: delivery/track_audit_*.json
          if-no-files-found: warn
          retention-days: 30
      - name: 年別MASTERを保存
        if: always() && inputs.mode != 'preflight' && inputs.mode != 'diagnose' && inputs.mode != 'cardprobe'
        uses: actions/upload-artifact@v4
        with:
          name: jra-original-master-${{ inputs.year }}
          path: delivery/*
          if-no-files-found: warn
          retention-days: 30
      - name: 一覧取得の調査ファイルを保存（失敗時も）
        if: always() && inputs.mode == 'diagnose'
        uses: actions/upload-artifact@v4
        with:
          name: jra-discovery-diagnostics-${{ inputs.year }}
          path: delivery/diagnostics/*
          if-no-files-found: warn
          retention-days: 30
      - name: 出馬表の調査ファイルを保存（失敗時も）
        if: always() && inputs.mode == 'cardprobe'
        uses: actions/upload-artifact@v4
        with:
          name: jra-card-probe-${{ inputs.year }}
          path: delivery/card_probe/*
          if-no-files-found: warn
          retention-days: 30
