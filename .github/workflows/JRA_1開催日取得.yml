name: JRA 1開催日取得テスト

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "取得するJRA開催日（YYYY-MM-DD）"
        required: true
        default: "2025-07-05"
        type: string

permissions:
  contents: read

jobs:
  collect-one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 軽量エンジンを展開する
        run: unzip -q CPH_GitHub実行エンジン_v0.1.zip -d engine

      - name: 必要ライブラリを準備する
        run: python -m pip install ./engine

      - name: 1開催日を取得・再検証する
        id: collect
        continue-on-error: true
        env:
          RACE_DATE: ${{ inputs.race_date }}
        run: bash engine/scripts/run_one_day_github.sh "$RACE_DATE"

      - name: ZIPとSHAを保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPH-JRA-${{ inputs.race_date }}-接続試験
          path: delivery/*
          if-no-files-found: error
          retention-days: 7

      - name: 取得失敗を明示する
        if: steps.collect.outcome == 'failure'
        run: exit 1
