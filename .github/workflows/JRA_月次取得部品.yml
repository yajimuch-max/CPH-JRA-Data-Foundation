name: JRA 月次取得部品 v0.4
on:
  workflow_call:
    inputs:
      year: { required: true, type: string }
      month: { required: true, type: string }
      previous_state: { required: false, type: string, default: "" }
      publish_annual: { required: false, type: boolean, default: false }
permissions:
  contents: read
jobs:
  collect-month:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: リポジトリを読み込む
        uses: actions/checkout@v4
      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 前月の状態を引き継ぐ
        if: inputs.previous_state != ''
        uses: actions/download-artifact@v4
        with: { name: "${{ inputs.previous_state }}", path: run_data }
      - name: 年間取得エンジンを展開する
        run: unzip -q ./*v0.4.zip -d engine
      - name: 必要ライブラリを準備する
        run: python -m pip install ./engine
      - name: 対象月を取得・監査する
        id: collect
        continue-on-error: true
        run: bash engine/scripts/run_month_github.sh "${{ inputs.year }}" "${{ inputs.month }}"
      - name: 次月用チェックポイントを保存する
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CPH-JRA-${{ inputs.year }}-${{ inputs.month }}-state
          path: run_data/**
          if-no-files-found: error
          retention-days: 1
      - name: 年間完成版ZIPとSHAを保存する
        if: always() && inputs.publish_annual
        uses: actions/upload-artifact@v4
        with:
          name: CPH-JRA-${{ inputs.year }}-年間完成版
          path: delivery/*
          if-no-files-found: error
          retention-days: 7
      - name: 取得失敗を明示する
        if: steps.collect.outcome == 'failure'
        run: exit 1
